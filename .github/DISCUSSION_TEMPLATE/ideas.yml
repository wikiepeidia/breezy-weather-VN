labels: Idea, Needs review
body:
  - type: markdown
    attributes:
      value: |
        This repository is a personal hobby fork, not the upstream Breezy Weather roadmap.

        General feature ideas should go upstream instead:
        https://github.com/breezy-weather/breezy-weather/discussions/categories/ideas

        Use this form only if the idea is specifically about this fork or was requested by the fork owner.

  - type: textarea
    id: feature-description
    attributes:
      label: Describe your idea
      description: Describe a fork-specific idea only. This is not the general Breezy Weather feature tracker.
      placeholder: |
        Example:
          "Here is how it should work: …"
    validations:
      required: true

  - type: textarea
    id: other-details
    attributes:
      label: Other details
      placeholder: |
        Additional details and attachments.

  - type: checkboxes
    id: acknowledgements
    attributes:
      label: Acknowledgements
      description: Your issue will be closed if you don’t read this carefully.
      options:
        - label: I understand this fork is not the general Breezy Weather idea tracker.
          required: true
        - label: This idea is specific to this fork, or it was explicitly requested by the fork owner.
          required: true
        - label: If this idea is actually meant for Breezy Weather generally, I will open it upstream instead.
          required: true
        - label: I wrote my request in English, and any screenshot I attached are also in English (language can be changed from Settings > Appearance). I can write in my native language under the English text, if necessary.
          required: true
        - label: I understand that this app is distributed in the hope that it will be useful, but WITHOUT ANY WARRANTY, so I may not get a positive reply to my request, if any at all.
          required: true
